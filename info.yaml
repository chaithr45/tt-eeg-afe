# Tiny Tapeout project information (TTSKY26d)
project:
  title:        "Low-noise neonatal EEG front-end"
  author:       "Sai Chaithr Aravapalli"
  discord:      ""
  description:  "Capacitive-feedback biopotential amplifier for neonatal EEG: 38 dB gain, <0.5 Hz to >15 kHz, ~3 uVrms noise (0.5-100 Hz), ~25 uW"
  language:     "Analog"
  clock_hz:     0

  tiles: "1x2"
  analog_pins: 2
  uses_vapwr: false

  # Rename with your GitHub username before submitting; must match the GDS/LEF names.
  top_module:  "tt_um_saichaithr_eeg_afe"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "rst (active high: hold 10 ms at power-up and after electrode artifacts)"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs (tied to VGND in the layout)
  uo[0]: ""
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins (unused; uio_out and uio_oe tied to VGND)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins
  ua[0]: "EEG input (AC-coupled on chip)"
  ua[1]: "Amplified output (DC level ~0.45 V)"
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
